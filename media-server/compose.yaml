      traefik.http.routers.bazarr-anime.tls.domains[0].sans: *media_domains_sans
      traefik.http.routers.bazarr-anime.service: bazarr-anime-svc
      traefik.http.services.bazarr-anime-svc.loadBalancer.server.port: "6767"
    volumes:
      - bazarr-anime-config:/config
      - media-server-anime-movies:/anime-movies
      - media-server-anime:/anime

volumes:
  seedbox-files:
  jellyfin-config:
  jellyfin-cache:
  seerr-config:
  flaresolverr-config:
  prowlarr-config:
  recyclarr-config:
  radarr-config:
  radarr-anime-config:
  sonarr-config:
  sonarr-anime-config:
  bazarr-config:
  bazarr-anime-config:
  media-server-movies:
    driver_opts:
      <<: *nas_nfs_driver_opts
      device: ":/mnt/saphnet-nas1b/media-server/jellyfin/movies"
  media-server-tv:
    driver_opts:
      <<: *nas_nfs_driver_opts
      device: ":/mnt/saphnet-nas1b/media-server/jellyfin/tv"
  media-server-anime:
    driver_opts:
      <<: *nas_nfs_driver_opts
      device: ":/mnt/saphnet-nas1b/media-server/jellyfin/anime"
  media-server-anime-movies:
    driver_opts:
      <<: *nas_nfs_driver_opts
      device: ":/mnt/saphnet-nas1b/media-server/jellyfin/anime-movies"
  seedbox-torrent-files:
    driver_opts:
      <<: *nas_nfs_driver_opts
      device: ":/mnt/saphnet-nas1b/media-server/deluge/torrent_files"
  seedbox-torrent-downloads:
    driver_opts:
      <<: *nas_nfs_driver_opts
      device: ":/mnt/saphnet-nas1b/media-server/deluge/torrent_downloads"

networks:
  media-server: # Should be externally available
    name: media-server
  web_bridge:
    name: web_bridge
    external: true