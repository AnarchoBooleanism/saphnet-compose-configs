# Be sure to define
# - DNS_NAMECHEAP_USERNAME
# - DNS_NAMECHEAP_API_KEY
# - CERTBOT_EMAIL
# - ED25519_PRIVATE_KEY_HEX

x-common:
  # Try to keep the order of this consistent, for Certbot's sake
  # Each line is a separate certificate, being a comma-separated list, where the first domain is the name of the certificate
  # Note that we currently don't have the ability to check whether the certificate has all the domains for the group, so
  # delete the certificate file for the group if any new domain is added to a certificate (TODO)
  TIMEZONE: &timezone "America/Los_Angeles"
  DOMAINS: &domains >-
    saphnet.xyz,www.saphnet.xyz,jellyfin.saphnet.xyz,map.thevoidpact.xyz
  ANUBIS: &anubis-environment # Default bind is 8923
    DIFFICULTY: "4"
    ED25519_PRIVATE_KEY_HEX: ${ED25519_PRIVATE_KEY_HEX}
    OG_PASSTHROUGH: "true"
    WEBMASTER_EMAIL: "homelab@saphnet.xyz"

x-services:
  anubis: &anubis
    image: ghcr.io/techarohq/anubis:v1.24.0
    # Set container_name here
    # For environment, set COOKIE_DOMAIN, PUBLIC_URL, REDIRECT_DOMAINS,
    # and TARGET here, and import anubis-environment!
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: "5s"
      timeout: "30s"
      retries: 5
      start_period: "500ms"
    networks:
      - web_bridge
    restart: unless-stopped

services:
  nginx:
    container_name: nginx
    image: ghcr.io/anarchobooleanism/saphnet-nginx:v0.1.1
    depends_on:
      certbot:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: *timezone
    volumes:
      # Main conf file
      - ./nginx/proxies.conf:/etc/nginx/proxies.conf:ro
      # Certificate files
      - certbot-conf:/etc/letsencrypt:ro
    networks:
      - web_bridge
    restart: unless-stopped
  
  certbot:
    image: ghcr.io/anarchobooleanism/certbot-dns-namecheap:v1.0.0-certbotv5.2.2-1
    # Make sure certbot is run first if not yet, then renew certificates every 12 hours
    entrypoint: [ "/certbot-entrypoint.sh" ]
    environment:
      TZ: *timezone
      DNS_NAMECHEAP_USERNAME: "${DNS_NAMECHEAP_USERNAME}"
      DNS_NAMECHEAP_API_KEY: "${DNS_NAMECHEAP_API_KEY}"
      CERTBOT_DOMAINS: *domains
      CERTBOT_EMAIL: "${CERTBOT_EMAIL}"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - ./certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
      - ./certbot-entrypoint-helper.py:/certbot-entrypoint-helper.py:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "[ -f /etc/letsencrypt/live/saphnet.xyz/fullchain.pem ]"]
      interval: "20s"
      retries: 12
      start_period: "10s"
      timeout: "10s"
    restart: unless-stopped

  # anubis-saphnet-main:
  #   <<: *anubis
  #   container-name: anubis-saphnet-main
  #   environment: # Default bind is 8923
  #     <<: *anubis-environment
  #     COOKIE_DOMAIN: "saphnet.xyz"
  #     PUBLIC_URL: "https://saphnet.xyz"
  #     REDIRECT_DOMAINS: "saphnet.xyz"
  #     SERVE_ROBOTS_TXT: "true"
  #     TARGET: "http://nginx" # TODO: Change me

  anubis-thevoidpact-map:
    <<: *anubis
    container_name: anubis-thevoidpact-map
    environment:
      <<: *anubis-environment
      COOKIE_DOMAIN: "map.thevoidpact.xyz"
      # PUBLIC_URL: "https://map.thevoidpact.xyz" # Leaving unset since we get redirect issues otherwise
      REDIRECT_DOMAINS: "map.thevoidpact.xyz"
      TARGET: "http://docker-host-pve4:63624"

  anubis-jellyfin:
    <<: *anubis
    container_name: anubis-jellyfin
    environment:
      <<: *anubis-environment
      COOKIE_DOMAIN: "jellyfin.saphnet.xyz"
      # PUBLIC_URL: "https://jellyfin.saphnet.xyz" # Leaving unset since we get redirect issues otherwise
      REDIRECT_DOMAINS: "jellyfin.saphnet.xyz"
      TARGET: "http://docker-host-pve3:8096"

volumes:
  certbot-conf:

networks:
  web_bridge:
    name: web_bridge # Should be externally available
    attachable: true
