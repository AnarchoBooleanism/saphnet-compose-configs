# Extra environment variables to set (in addition to in base.yaml):
# - ED25519_PRIVATE_KEY_HEX (create with "openssl rand -hex 32")
# - DASHBOARD_LOGIN (create with htpasswd, is in format of username:passwordhash)
# - DOCKER_HOST_PVE3_TAILSCALE_IP - Tailscale IP address of docker-host-pve3, for
# direct connections, skipping the 192.168.8.0/23 network

x-common:
  DASHBOARD_HOST: &dashboard_host "Host(`traefik-vps1.saphnet.xyz`)" # Domain name for dashboard
  ANUBIS: &anubis-environment # Default bind is 8923
    DIFFICULTY: "4"
    ED25519_PRIVATE_KEY_HEX: ${ED25519_PRIVATE_KEY_HEX}
    OG_PASSTHROUGH: "true"
    WEBMASTER_EMAIL: "homelab@saphnet.xyz"

x-services:
  anubis: &anubis
    image: ghcr.io/techarohq/anubis:v1.24.0
    # Set container_name here
    # For environment, set COOKIE_DOMAIN, PUBLIC_URL, and REDIRECT_DOMAINS,
    # and import anubis-environment!
    # Make sure to set the right labels for your Anubis instance!
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: "5s"
      timeout: "30s"
      retries: 5
      start_period: "500ms"
    networks:
      - web_bridge
    restart: unless-stopped

services:
  traefik:
    labels:
      # Enable self‑routing
      traefik.enable: "true"

      # Dashboard router
      traefik.http.routers.dashboard.rule: *dashboard_host
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.tls: "true"
      traefik.http.routers.dashboard.tls.certresolver: letsencrypt
      traefik.http.routers.dashboard.middlewares: dashboard-ipallowlist@docker, dashboard-auth@docker
      traefik.http.middlewares.dashboard-auth.basicauth.users: "${DASHBOARD_LOGIN}"
      traefik.http.middlewares.dashboard-ipallowlist.ipallowlist.sourcerange: "100.64.0.0/10, fd7a:115c:a1e0::/48"

      # Anubis middleware
      traefik.http.middlewares.anubis-thevoidpact.forwardauth.address: http://anubis-thevoidpact:8923/.within.website/x/cmd/anubis/api/check
      traefik.http.middlewares.anubis-saphnet.forwardauth.address: http://anubis-saphnet:8923/.within.website/x/cmd/anubis/api/check

      # map.thevoidpact.xyz
      traefik.http.routers.thevoidpact-map.rule: Host(`map.thevoidpact.xyz`)
      traefik.http.routers.thevoidpact-map.entrypoints: websecure
      traefik.http.routers.thevoidpact-map.tls: "true"
      traefik.http.routers.thevoidpact-map.tls.certresolver: letsencrypt
      traefik.http.routers.thevoidpact-map.tls.domains[0].main: map.thevoidpact.xyz
      traefik.http.routers.thevoidpact-map.tls.domains[0].sans: "anubis.thevoidpact.xyz"
      traefik.http.routers.thevoidpact-map.middlewares: anubis-thevoidpact@docker
      traefik.http.routers.thevoidpact-map.service: thevoidpact-map-svc
      traefik.http.services.thevoidpact-map-svc.loadbalancer.server.url: http://docker-host-pve4:63624
      # Media stack
      # jellyfin.media.saphnet.xyz
      traefik.http.routers.jellyfin.rule: Host(`jellyfin.media.saphnet.xyz`)
      traefik.http.routers.jellyfin.entrypoints: websecure
      traefik.http.routers.jellyfin.tls: "true"
      traefik.http.routers.jellyfin.tls.certresolver: letsencrypt
      traefik.http.routers.jellyfin.tls.domains[0].main: media.saphnet.xyz
      traefik.http.routers.jellyfin.tls.domains[0].sans: "*.media.saphnet.xyz"
      traefik.http.routers.jellyfin.middlewares: anubis-saphnet@docker
      traefik.http.routers.jellyfin.service: jellyfin-svc
      traefik.http.services.jellyfin-svc.loadbalancer.server.url: https://jellyfin.media.int.saphnet.xyz
      ## Redirect from media.saphnet.xyz
      traefik.http.routers.saphnet-media.rule: "Host(`media.saphnet.xyz`)"
      traefik.http.routers.saphnet-media.middlewares: "saphnet-media-redirectregex"
      traefik.http.routers.saphnet-media.tls: true
      traefik.http.routers.saphnet-media.tls.certresolver: letsencrypt
      traefik.http.routers.saphnet-media.tls.domains[0].main: media.saphnet.xyz
      traefik.http.routers.saphnet-media.tls.domains[0].sans: "*.media.saphnet.xyz"
      traefik.http.middlewares.saphnet-media-redirectregex.redirectregex.regex: "^https://media\\.saphnet\\.xyz/(.*)"
      traefik.http.middlewares.saphnet-media-redirectregex.redirectregex.replacement: "https://jellyfin.media.saphnet.xyz/$${1}"
      # jellyseerr.media.saphnet.xyz
      traefik.http.routers.jellyseerr.rule: Host(`jellyseerr.media.saphnet.xyz`)
      traefik.http.routers.jellyseerr.entrypoints: websecure
      traefik.http.routers.jellyseerr.tls: "true"
      traefik.http.routers.jellyseerr.tls.certresolver: letsencrypt
      traefik.http.routers.jellyseerr.tls.domains[0].main: media.saphnet.xyz
      traefik.http.routers.jellyseerr.tls.domains[0].sans: "*.media.saphnet.xyz"
      traefik.http.routers.target.middlewares: anubis-saphnet@docker
      traefik.http.routers.jellyseerr.service: jellyseerr-svc
      traefik.http.services.jellyseerr-svc.loadbalancer.server.url: https://jellyseerr.media.int.saphnet.xyz
    extra_hosts:
      jellyfin.media.int.saphnet.xyz: "${DOCKER_HOST_PVE3_TAILSCALE_IP}"
      jellyseerr.media.int.saphnet.xyz: "${DOCKER_HOST_PVE3_TAILSCALE_IP}"

  under-construction: # Serving "under construction" pages
    image: ghcr.io/palmergw/under-construction-page:0c76870ebebca03d451e3de2a074fbf21ecf3893
    container_name: under-construction
    labels:
      traefik.enable: "true"
      traefik.http.services.under-construction-svc.loadbalancer.server.port: "80"
      # saphnet.xyz
      traefik.http.routers.saphnet.rule: Host(`saphnet.xyz`)
      traefik.http.routers.saphnet.entrypoints: websecure
      traefik.http.routers.saphnet.tls: "true"
      traefik.http.routers.saphnet.tls.certresolver: letsencrypt
      traefik.http.routers.saphnet.tls.domains[0].main: saphnet.xyz
      traefik.http.routers.saphnet.tls.domains[0].sans: "www.saphnet.xyz,anubis.saphnet.xyz"
      traefik.http.routers.saphnet.middlewares: anubis-saphnet@docker
      traefik.http.routers.saphnet.service: under-construction-svc
      # www.saphnet.xyz
      traefik.http.routers.saphnet-www.rule: "Host(`www.saphnet.xyz`)"
      traefik.http.routers.saphnet-www.middlewares: "saphnet-www-redirectregex"
      traefik.http.routers.saphnet-www.tls: true
      traefik.http.routers.saphnet-www.tls.certresolver: letsencrypt
      traefik.http.routers.saphnet-www.tls.domains[0].main: saphnet.xyz
      traefik.http.routers.saphnet-www.tls.domains[0].sans: "www.saphnet.xyz,anubis.saphnet.xyz"
      traefik.http.middlewares.saphnet-www-redirectregex.redirectregex.regex: "^https://www\\.saphnet\\.xyz/(.*)"
      traefik.http.middlewares.saphnet-www-redirectregex.redirectregex.replacement: "https://saphnet.xyz/$${1}"
    networks:
      - web_bridge
    restart: unless-stopped

  anubis-thevoidpact:
    <<: *anubis
    container_name: anubis-main
    labels:
      traefik.enable: "true"
      traefik.http.routers.anubis-thevoidpact.rule: Host(`anubis.thevoidpact.xyz`)
      traefik.http.routers.anubis-thevoidpact.entrypoints: websecure
      traefik.http.routers.anubis-thevoidpact.tls: "true"
      traefik.http.routers.anubis-thevoidpact.tls.certresolver: letsencrypt
      traefik.http.routers.anubis-thevoidpact.tls.domains[0].main: map.thevoidpact.xyz
      traefik.http.routers.anubis-thevoidpact.tls.domains[0].sans: "anubis.thevoidpact.xyz"
      traefik.http.routers.anubis-thevoidpact.service: anubis-thevoidpact-svc
      traefik.http.services.anubis-thevoidpact-svc.loadbalancer.server.port: "8923"
    environment:
      <<: *anubis-environment
      COOKIE_DOMAIN: "thevoidpact.xyz"
      PUBLIC_URL: "https://anubis.thevoidpact.xyz"
      REDIRECT_DOMAINS: "map.thevoidpact.xyz"

  anubis-saphnet:
    <<: *anubis
    container_name: anubis-saphnet
    labels:
      traefik.enable: "true"
      traefik.http.routers.anubis-saphnet.rule: Host(`anubis.saphnet.xyz`)
      traefik.http.routers.anubis-saphnet.entrypoints: websecure
      traefik.http.routers.anubis-saphnet.tls: "true"
      traefik.http.routers.anubis-saphnet.tls.certresolver: letsencrypt
      traefik.http.routers.anubis-saphnet.tls.domains[0].main: saphnet.xyz
      traefik.http.routers.anubis-saphnet.tls.domains[0].sans: "www.saphnet.xyz,anubis.saphnet.xyz"
      traefik.http.routers.anubis-saphnet.service: anubis-saphnet-svc
      traefik.http.services.anubis-saphnet-svc.loadbalancer.server.port: "8923"
    environment:
      <<: *anubis-environment
      COOKIE_DOMAIN: "saphnet.xyz"
      PUBLIC_URL: "https://anubis.saphnet.xyz"
      REDIRECT_DOMAINS: >-
        jellyfin.media.saphnet.xyz,jellyseerr.media.saphnet.xyz,saphnet.xyz
