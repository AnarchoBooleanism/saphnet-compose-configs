services:
  vertd:
    image: ghcr.io/vert-sh/vertd:latest@sha256:cc9ece0b9a3fee34f965e3430afc0dd61ed7bad68ab81a7653c5655e06ef3ed9
    container_name: vertd
    environment:
      WEBHOOK_URL: "${WEBHOOK_URL}"
      WEBHOOK_PINGS: "${WEBHOOK_PINGS}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      PUBLIC_URL: "${PUBLIC_URL}"
    # ports:
    #   - "${PORT:-24153}:24153"
    networks:
      - web_bridge
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.vertd.rule: Host(`vertd.int.saphnet.xyz`)
      traefik.http.routers.vertd.entrypoints: websecure
      traefik.http.routers.vertd.tls: "true"
      traefik.http.routers.vertd.tls.certresolver: letsencrypt
      traefik.http.routers.vertd.tls.domains[0].main: vertd.int.saphnet.xyz
      traefik.http.routers.vertd.service: vertd-svc
      traefik.http.services.vertd-svc.loadBalancer.server.port: "24153"
    # For NVIDIA cards, keep the following section:
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [ gpu ]
    
    # For AMD/Intel GPUs, uncomment the "devices" section - then remove
    # or comment out the "deploy" section and the "runtime" string used
    # for NVIDIA GPUs.
    #
    devices:
      - /dev/dri

networks:
  web_bridge:
    name: web_bridge
    external: true
