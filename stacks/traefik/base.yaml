# To be run, and merged, with another host-specific file (e.g. docker-host-pve3.yaml)
# Example command:
# docker compose -f base.yaml -f docker-host-pve3.yaml up

# Environment variables to set:
# - NAMECHEAP_API_USER
# - NAMECHEAP_API_KEY
# - ACME_EMAIL

services:
  traefik: # Reverse proxy, with dashboard enabled
    image: traefik:v3.6.13@sha256:34d5089d0b414945342848518b383f11f5b3a645504ed87b77ffeb9d683d0e48
    container_name: traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    environment:
      NAMECHEAP_API_USER: "${NAMECHEAP_API_USER}"
      NAMECHEAP_API_KEY: "${NAMECHEAP_API_KEY}"
    ports: # Port 8080 is for dashboard, but it should be through HTTPS anyway
      - "80:80"
      - "443:443"
    networks:
      - web_bridge
    extra_hosts: # To connect to containers with network_mode as "host"
      - "host.docker.internal:host-gateway"
    command:
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.forwardedHeaders.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8"
      - "--entrypoints.websecure.proxyProtocol.trustedIPs=127.0.0.1/32,172.16.0.0/12,10.0.0.0/8"
      # For Immich
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=600s"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=600s"

      # Providers 
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web_bridge" # Make sure this is the name of your Docker network!

      # API & Dashboard 
      - "--api.dashboard=true"
      - "--api.insecure=false"

      # Observability 
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"

      # SSL certificates
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=namecheap"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"

      # For backend services
      - "--serversTransport.insecureSkipVerify=true"

      # Cache plugin
      - "--experimental.plugins.cache.modulename=github.com/ciaranj/cacheify"
      - "--experimental.plugins.cache.version=v0.0.8" # TODO: Find way to automate updating this (maybe move this to file, then have file that checks the TOML file and then checks Git repo tags)

      # Miscellaneous
      - "--global.sendAnonymousUsage=true"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  traefik-certs:

networks:
  web_bridge:
    name: web_bridge
    attachable: true
