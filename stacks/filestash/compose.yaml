services:
  app:
    image: machines/filestash:latest@sha256:b7655a7becac4a7c94d65e9a5784b427a49094aa28bda8901fafff644307c864
    container_name: filestash
    volumes:
      - filestash:/app/data/state/
    environment:
      APPLICATION_URL: filestash.int.saphnet.xyz
      CANARY: "true"
      OFFICE_URL: http://127.0.0.1:9980
      OFFICE_FILESTASH_URL: http://app:8334
    # ports:
    # - "8334:8334"
    networks:
      - web_bridge
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.filestash.rule: Host(`filestash.int.saphnet.xyz`)
      traefik.http.routers.filestash.entrypoints: websecure
      traefik.http.routers.filestash.tls: true
      traefik.http.routers.filestash.tls.certresolver: letsencrypt
      traefik.http.routers.filestash.tls.domains[0].main: int.saphnet.xyz
      traefik.http.routers.filestash.tls.domains[0].sans: "*.int.saphnet.xyz"
      traefik.http.routers.filestash.service: filestash-svc
      traefik.http.services.filestash-svc.loadBalancer.server.port: "8334"

  wopi_server:
    image: collabora/code:26.04.3.2.1@sha256:379b8f1fc955dd6d01ba24adf61d1b177048ddaae179ae8c1e6a6342daccb282
    container_name: filestash_wopi
    environment:
      extra_params: "--o:ssl.enable=false"
      aliasgroup1: "https://.*:443"
    ports:
      - "9980:9980"
    entrypoint:
      - /bin/bash
      - -c
      - |
        curl -o /usr/share/coolwsd/browser/dist/branding-desktop.css https://gist.githubusercontent.com/mickael-kerjean/bc1f57cd312cf04731d30185cc4e7ba2/raw/d706dcdf23c21441e5af289d871b33defc2770ea/destop.css
        /bin/su -s /bin/bash -c '/start-collabora-online.sh' cool
    restart: unless-stopped
    user: root

networks:
  web_bridge:
    name: web_bridge
    external: true

volumes:
  filestash:
