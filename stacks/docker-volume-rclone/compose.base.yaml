# To be run, and merged, with another host-specific file (e.g. compose.control-server.yaml)
# Example command:
# docker compose -f compose.base.yaml -f compose.control-server.yaml up

x-common:
  TIMEZONE: &timezone "${TIMEZONE}"

services:
  docker-volume-rclone: &docker-volume-rclone # Is base service
    image: ghcr.io/anarchobooleanism/docker-volume-rclone:v0.5.0@sha256:dc7eb80f75af3742075d01696ffd1a9c93b5e2fd0aaed961274ca8626f66eb7e
    volumes:
      - /var/lib/docker/volumes:/volumes:ro
      - nfs-target:/volumes-clone
    environment: &environment
      # Set TARGET_SUBDIR_NAME here
      # Set VOLUME_NAMES here, is space-delimited string, use ">-"
      RUN_ON_STARTUP: "false"
      CRON_ARGUMENTS: "0 */4 * * *" # At minute 0, every 4 hours
      # RCLONE_OPTIONS:
      TZ: *timezone

volumes:
  nfs-target:
    driver_opts:
      type: "nfs"
      o: "addr=nas1.int-net.saphnet.xyz,nolock,soft,rw,nfsvers=4"
      device: ":/mnt/saphnet-nas1c/docker-volume-backups"
