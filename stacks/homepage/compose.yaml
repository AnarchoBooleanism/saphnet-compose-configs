services:
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Mounted as read-only
    environment:
      CONTAINERS: "1" # Allow access to viewing containers
      SERVICES: "1" # Allow access to viewing services (necessary when using Docker Swarm)
      TASKS: "1" # Allow access to viewing tasks (necessary when using Docker Swarm)
      POST: "0" # Disallow any POST operations (effectively read-only)
    ports:
      - "0.0.0.0:2375:2375"
    networks:
      - web_bridge
    restart: unless-stopped

  # This expects to be given a path to a secrets file (by the "docker compose up" command)
  # to use for secrets as environment variables
  homepage:
    image: ghcr.io/anarchobooleanism/saphnet-homepage:edge@sha256:9c37c5d836f60624d20513b26c1a5dedc7a46e2e3ebeb93274f0171d4d499437
    container_name: homepage
    depends_on:
      - docker-proxy
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.int.saphnet.xyz
    env_file:
      - ./.env
      - ${SOPS_SECRETS_PATH:?Please set SOPS_SECRETS_PATH}
    # ports:
    # - "3000:3000"
    networks:
      - web_bridge
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.homepage.rule: Host(`homepage.int.saphnet.xyz`)
      traefik.http.routers.homepage.entrypoints: websecure
      traefik.http.routers.homepage.tls: "true"
      traefik.http.routers.homepage.tls.certresolver: letsencrypt
      traefik.http.routers.homepage.tls.domains[0].main: int.saphnet.xyz
      traefik.http.routers.homepage.tls.domains[0].sans: "*.int.saphnet.xyz"
      traefik.http.routers.homepage.service: homepage-svc
      traefik.http.services.homepage-svc.loadBalancer.server.port: "3000"
      # Redirect int.saphnet.xyz to homepage.int.saphnet.xyz
      traefik.http.routers.saphnet-int.rule: "Host(`int.saphnet.xyz`)"
      traefik.http.routers.saphnet-int.middlewares: "saphnet-int-redirectregex"
      traefik.http.routers.saphnet-int.tls: "true"
      traefik.http.routers.saphnet-int.tls.certresolver: letsencrypt
      traefik.http.routers.saphnet-int.tls.domains[0].main: int.saphnet.xyz
      traefik.http.routers.saphnet-int.tls.domains[0].sans: "*.int.saphnet.xyz"
      traefik.http.routers.saphnet-int.service: homepage-svc
      traefik.http.middlewares.saphnet-int-redirectregex.redirectregex.regex: "^https://int\\.saphnet\\.xyz/(.*)"
      traefik.http.middlewares.saphnet-int-redirectregex.redirectregex.replacement: "https://homepage.int.saphnet.xyz/$${1}"

networks:
  web_bridge:
    name: web_bridge
    external: true
