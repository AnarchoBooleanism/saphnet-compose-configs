services: # To be connected to by Homepage
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Mounted as read-only
    environment:
      CONTAINERS: "1" # Allow access to viewing containers
      SERVICES: "1" # Allow access to viewing services (necessary when using Docker Swarm)
      TASKS: "1" # Allow access to viewing tasks (necessary when using Docker Swarm)
      POST: "0" # Disallow any POST operations (effectively read-only)
    ports:
      - "${HOST_IP:-0.0.0.0}:2375:2375"
    restart: unless-stopped

# NOTE: If using this on a host that has a publicly accessible IP address, make sure
# you specify a non-public IP address to restrict the port to, as HOST_IP!