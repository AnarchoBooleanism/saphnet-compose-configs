# To be run, and merged, with the base file
# Example command:
# docker compose -f compose.base.yaml -f compose.vps1.yaml up

services:
  velocity:
    volumes:
      - ./velocity-config/docker-host-pve4.toml:/config/velocity.toml:ro
    networks:
      - pterodactyl_nw

  velocity-sftp: 
    ports: !override
    # Since Pterodactyl is already taking 2022, make sure this file is listed after the base one
      - "${TAILSCALE_IP:-0.0.0.0}:2023:22"

networks:
  pterodactyl_nw: # Since we want to connect to the upstream server directly
    name: pterodactyl_nw
    external: true
