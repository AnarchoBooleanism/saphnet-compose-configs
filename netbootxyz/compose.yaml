# Environment variables to set:
# - NETBOOT_LOGIN (create with htpasswd, is in format of username:passwordhash)

services:
  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz:latest@sha256:bfe21f85fcb9cc7e76b77fafcfb23c3c3ee6d06b27ef066d61ec1de04c2cca78
    container_name: netbootxyz
    ports:
      # - "3000:3000"  # optional, destination should match ${WEB_APP_PORT} variable above.
      - "69:69/udp"
      - "8080:80"  # optional, destination should match ${NGINX_PORT} variable above.
    labels:
      traefik.enable: "true"
      traefik.http.routers.netboot.rule: Host(`netboot.int.saphnet.xyz`)
      traefik.http.routers.netboot.entrypoints: websecure
      traefik.http.routers.netboot.tls: "true"
      traefik.http.routers.netboot.tls.certresolver: letsencrypt
      traefik.http.routers.netboot.tls.domains[0].main: int.saphnet.xyz
      traefik.http.routers.netboot.tls.domains[0].sans: "*.int.saphnet.xyz"
      traefik.http.routers.netboot.service: netboot-svc
      traefik.http.services.netboot-svc.loadBalancer.server.port: "3000"
      # Basic‑auth middleware
      traefik.http.routers.netboot.middlewares: netboot-auth
      traefik.http.middlewares.netboot-auth.basicauth.users: "${NETBOOT_LOGIN}"
    environment:
      NGINX_PORT: "80" # optional
      WEB_APP_PORT: "3000" # optional
#     MENU_VERSION: "2.0.47" # optional
    volumes:
      - netboot-config:/config
      - netboot-assets:/assets
      - ./local-vars.ipxe:/config/menus/local-vars.ipxe
    networks:
      - web_bridge
    restart: unless-stopped

volumes:
  netboot-config: # Boot menu files, web application config
  netboot-assets: # Bootable assets (e.g. live CDs)
    driver_opts:
      type: "nfs"
      o: "addr=nas1.int-net.saphnet.xyz,nolock,soft,rw,nfsvers=4"
      device: ":/mnt/saphnet-nas1c/netboot-assets"

networks:
  web_bridge:
    name: web_bridge
    external: true
