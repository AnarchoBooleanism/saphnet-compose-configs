      service: docker-volume-rclone
    environment:
      TARGET_SUBDIR_NAME: docker-host-pve3
      VOLUME_NAMES: >-
        deluge-seedbox_deluge-config
        deluge-seedbox_sftp-config
        deluge-seedbox_tailscale-config
        foldingathome_foldingathome
        media-server_bazarr-config
        media-server_flaresolverr-config
        media-server_jellyfin-config
        media-server_jellyseerr-config
        media-server_radarr-config
        media-server_prowlarr-config
        media-server_radarr-anime-config
        media-server_radarr-config
        media-server_recyclarr-config
        media-server_sonarr-anime-config
        media-server_sonarr-config
