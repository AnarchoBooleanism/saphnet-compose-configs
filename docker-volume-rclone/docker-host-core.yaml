# To be run, and merged, with the base file
# Example command:
# docker compose -f base.yaml -f docker-host-core.yaml up

services:
  docker-volume-rclone:
    environment:
      TARGET_SUBDIR_NAME: docker-host-core
      VOLUME_NAMES: >-
        filestash_filestash
        guacamole_guac-db-data
        pterodactyl-panel_database-data
        pterodactyl-panel_panel-data
        pterodactyl-panel_panel-logs
        netbootxyz_netboot-config
        n8n_db-storage
        n8n_n8n-storage
        n8n_redis-storage
