# Environment variables to set:
# - DB_PASSWORD
# - REDIS_PASSWORD
# - TAILSCALE_IP, if you want to restrict access to Immich port to just Tailscale only (for external Traefik)

x-common:
  TIMEZONE: &timezone "America/Los_Angeles"
  DATABASE: &database
    DB_USERNAME: &db_username "postgres"
    DB_NAME: &db_name "immich"

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v2.5.6@sha256:aa163d2e1cc2b16a9515dd1fef901e6f5231befad7024f093d7be1f2da14341a  # To only update intentionally
    extends:
      file: ./extra/hwaccel.transcoding.yaml
      service: quicksync # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    ports:
      - "${TAILSCALE_IP:-0.0.0.0}:2283:2283"
    labels:
      traefik.enable: true
      traefik.http.routers.immich.rule: Host(`immich.int.saphnet.xyz`)
      traefik.http.routers.immich.entrypoints: websecure
      traefik.http.routers.immich.tls: true
      traefik.http.routers.immich.tls.certresolver: letsencrypt
      traefik.http.routers.immich.tls.domains[0].main: immich.int.saphnet.xyz
      traefik.http.routers.immich.service: immich-svc
      traefik.http.services.immich-svc.loadBalancer.server.port: "2283"
    environment:
      <<: *database
      TZ: *timezone
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - immich-data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - immich-internal
      - web_bridge
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false
    restart: unless-stopped

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:v2.5.6-openvino@sha256:fec6fd64c322b962a7f9830be805096c569b658d99b7732c43e0d7ea472b6e8f
    extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
      file: ./extra/hwaccel.ml.yaml
      service: openvino # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    networks:
      - immich-internal
    deploy:
      resources:
        limits:
          memory: "8G"
    healthcheck:
      disable: false
    restart: unless-stopped

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:930b41430fb727f533c5982fe509b6f04233e26d0f7354e04de4b0d5c706e44e
    command:
      - "--requirepass ${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    networks:
      - immich-internal
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: *db_username
      POSTGRES_DB: *db_name
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - immich-db-16:/var/lib/postgresql/data
    networks:
      - immich-internal
    shm_size: 128mb
    healthcheck:
      disable: false
    restart: unless-stopped

volumes:
  model-cache:
  immich-data:
    driver_opts:
      type: "nfs"
      o: "addr=nas1.int-net.saphnet.xyz,nolock,soft,rw,nfsvers=4"
      device: ":/mnt/saphnet-nas1a/immich-data"
  immich-db:
  immich-db-16:

networks:
  immich-internal:
  web_bridge:
    name: web_bridge
    external: true
