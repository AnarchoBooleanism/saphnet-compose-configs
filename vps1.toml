## Stack-related procedures

[[procedure]]
name = "vps1_redeploy-changed"
description = "A procedure that redeploys all IaC stacks that have had changes to their config or config files, for vps1."
tags = ["redeploy-changed", "iac"]

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [ # Make sure to give all the names of all stacks here!
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = """
docker-proxy-vps1
glances-vps1
traefik-vps1
velocity-vps1
""", enabled = true }
]

## Stacks

# docker-proxy
[[stack]]
name = "docker-proxy-vps1"
description = "Used as a way to access the internal Docker socket from outside (read-only), mostly by Homepage."
tags = ["docker-proxy", "iac"]
[stack.config]
server = "vps1"
poll_for_updates = true
auto_update = true
auto_update_all_services = true
destroy_before_deploy = true
linked_repo = "saphnet-compose-configs"
run_directory = "stacks/docker-proxy"
environment = """
HOST_IP = '[[TAILSCALE_IP_VPS1]]'
"""

# glances
[[stack]]
name = "glances-vps1"
description = "A real-time monitoring tool for systems (e.g. processes and hardware usage), equivalent to top/htop."
tags = ["glances", "iac"]
[stack.config]
server = "vps1"
poll_for_updates = true
auto_update = true
auto_update_all_services = true
destroy_before_deploy = true
linked_repo = "saphnet-compose-configs"
run_directory = "stacks/glances"
file_paths = ["vps1.yaml"]
config_files = [
  { path = "compose.yaml", requires = "Redeploy" }
]

# traefik
[[stack]]
name = "traefik-vps1"
description = "A cloud-native reverse proxy and load balancer."
tags = ["traefik", "iac"]
[stack.config]
server = "vps1"
auto_update = true
auto_update_all_services = true
destroy_before_deploy = true
linked_repo = "saphnet-compose-configs"
run_directory = "stacks/traefik"
file_paths = ["base.yaml", "vps1.yaml"]
config_files = [
  { path = "secrets/vps1.enc.env", requires = "Redeploy" }
]
compose_cmd_wrapper = "sops exec-env secrets/vps1.enc.env '[[COMPOSE_COMMAND]]'"
compose_cmd_wrapper_include = ["up", "config", "build", "pull", "run"]
environment = """
NAMECHEAP_API_USER = '[[NAMECHEAP_USERNAME]]'
NAMECHEAP_API_KEY = '[[NAMECHEAP_API_KEY]]'
ACME_EMAIL = '[[CERTBOT_EMAIL]]'
DASHBOARD_PASSWORD = '[[TRAEFIK_DASHBOARD_PASSWORD]]'
DASHBOARD_LOGIN = '[[TRAEFIK_DASHBOARD_LOGIN]]'
"""

# velocity-vps1
[[stack]]
name = "velocity-vps1"
description = "A modern reverse proxy for Minecraft servers, intended for public-facing vps1."
tags = ["iac"]
[stack.config]
server = "vps1"
poll_for_updates = true
auto_update = true
auto_update_all_services = true
destroy_before_deploy = true
linked_repo = "saphnet-compose-configs"
run_directory = "stacks/velocity-vps1"
config_files = [
  { path = "secrets/vps1.enc.env", requires = "Redeploy" },
  { path = "velocity-config/velocity.toml", requires = "Restart" }
]
compose_cmd_wrapper = "sops exec-env secrets/vps1.enc.env '[[COMPOSE_COMMAND]]'"
compose_cmd_wrapper_include = ["up", "config", "build", "pull", "run"]
environment = """
TAILSCALE_IP = '[[TAILSCALE_IP_VPS1]]'
"""

