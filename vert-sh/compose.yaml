services:
  vert:
    image: ghcr.io/vert-sh/vert:latest@sha256:921bd61b3d786ecedce81e5ec0cb5112bce6c43d64e331a53af6862e56bd3ebd
    container_name: vert
    labels:
      traefik.enable: "true"
      traefik.http.routers.vert.rule: Host(`vert.int.saphnet.xyz`)
      traefik.http.routers.vert.entrypoints: websecure
      traefik.http.routers.vert.tls: "true"
      traefik.http.routers.vert.tls.certresolver: letsencrypt
      traefik.http.routers.vert.tls.domains[0].main: int.saphnet.xyz
      traefik.http.routers.vert.tls.domains[0].sans: "*.int.saphnet.xyz"
      traefik.http.routers.vert.service: vert-svc
      traefik.http.services.vert-svc.loadBalancer.server.port: "80"
    environment:
      PUB_HOSTNAME: "${PUB_HOSTNAME:-vert.int.saphnet.xyz}"
      PUB_PLAUSIBLE_URL: "${PUB_PLAUSIBLE_URL:-https://plausible.example.com}"
      PUB_ENV: "${PUB_ENV:-production}"
      PORT: "${PORT:-3000}"
      PUB_VERTD_URL: https://vertd.int.saphnet.xyz
    networks:
      - web_bridge
    restart: unless-stopped

networks:
  web_bridge:
    name: web_bridge
    external: true
