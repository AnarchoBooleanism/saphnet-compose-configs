## Stack-related procedures

[[procedure]]
name = "docker-host-pve3_redeploy-changed"
description = "A procedure that redeploys all IaC stacks that have had changes to their config or config files, for docker-host-pve3."
tags = ["redeploy-changed", "iac"]

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [ # Make sure to give all the names of all stacks here!
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = """
deluge-seedbox
docker-proxy-pve3
docker-volume-rclone-pve3
foldingathome
glances-pve3
immich
media-server
traefik-pve3
vertd
""", enabled = true }
]

## Stacks

# deluge-seedbox
[[stack]]
name = "deluge-seedbox"
description = "A torrent client for file sharing, behind a VPN, and an SFTP server for accessing these files."
tags = ["iac"]
[stack.config]
server = "docker-host-pve3"
poll_for_updates = true
auto_update = true
auto_update_all_services = true
destroy_before_deploy = true
linked_repo = "saphnet-compose-configs"
run_directory = "stacks/deluge-seedbox"
config_files = [
  { path = "secrets/docker-host-pve3.enc.env", requires = "Redeploy" }
]
compose_cmd_wrapper = "sops exec-env secrets/docker-host-pve3.enc.env '[[COMPOSE_COMMAND]]'"
compose_cmd_wrapper_include = ["up", "config", "build", "pull", "run"]
environment = """
"""

