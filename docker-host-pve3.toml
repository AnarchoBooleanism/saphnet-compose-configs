[stack.config]
server = "docker-host-pve3"
poll_for_updates = true
auto_update = true
auto_update_all_services = true
destroy_before_deploy = true
linked_repo = "saphnet-compose-configs"
run_directory = "stacks/media-server"
environment = """
TAILSCALE_IP = '[[TAILSCALE_IP_PVE3]]'
"""

