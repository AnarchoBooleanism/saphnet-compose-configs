# immich
[[stack]]
name = "immich"
description = "A self-hosted photo and video management solution."
tags = ["iac", "gpu"]
[stack.config]
server = "docker-host-pve3"
auto_update = true
auto_update_all_services = true
destroy_before_deploy = true
linked_repo = "saphnet-compose-configs"
run_directory = "stacks/immich"
config_files = [
  { path = "extra/hwaccel.ml.yaml", requires = "Redeploy" },
  { path = "extra/hwaccel.transcoding.yaml", requires = "Redeploy" },
  { path = "secrets/docker-host-pve3.enc.env", requires = "Redeploy" },
]
compose_cmd_wrapper = "sops exec-env secrets/docker-host-pve3.enc.env '[[COMPOSE_COMMAND]]'"
compose_cmd_wrapper_include = ["up", "config", "build", "pull", "run"]
environment = """
TAILSCALE_IP = '[[TAILSCALE_IP_PVE3]]'
"""

# media-server
