# Much of this comes from https://wiki.s5gi.com/guides/linux/pterodactyl_and_wings_dockerized
#                         https://www.youtube.com/watch?v=eeLNsNuVBn4

# Common variables, declared here
x-common:
  database:
    &db-environment
    MYSQL_PASSWORD: &db-password "basic_mysql_password"
    MYSQL_ROOT_PASSWORD: "basic_mysql_root_password"
  panel:
    &panel-environment
    #This is the URL that your panel will be on after being reverse proxied.
    # set this to "https://yoursubdomain.yourdomain.yourdomainstld"
    APP_URL: "https://pterodactyl.int.saphnet.xyz"
    # A list of valid timezones can be found here:
    # http://php.net/manual/en/timezones.php
    APP_TIMEZONE: "America/Los_Angeles"
    APP_SERVICE_AUTHOR: "homelab@saphnet.xyz"
    TRUSTED_PROXIES: "*" # TODO: Replace this with something more permanent
  mail:
    &mail-environment
    MAIL_FROM: "homelab@saphnet.xyz"
    MAIL_DRIVER: "smtp"
    MAIL_HOST: "mail.privateemail.com"
    MAIL_PORT: "465"
    MAIL_USERNAME: "homelab@saphnet.xyz"
    MAIL_PASSWORD: ${MAIL_PASSWORD}
    MAIL_ENCRYPTION: "true"

services:
  wings:
    image: ghcr.io/pterodactyl/wings:v1.11.13
    restart: unless-stopped
    networks:
      - ptero0
    ports:
      - "8280:8080"
      - "8443:443" # This looks like it's for nginx
      - "2022:2022" # SFTP port
    tty: true
    environment:
      TZ: "America/Los_Angeles"
      # For ease of setup, this is going to use root user.
      WINGS_UID: 0
      WINGS_GID: 0
      WINGS_USERNAME: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./wings-config.yaml:/etc/pterodactyl/config.yml
      - wings-data:/var/lib/pterodactyl
      - wings-logs:/var/log/pterodactyl
  database:
    image: mariadb:12.1.2
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - database-data:/var/lib/mysql
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"
  cache:
    image: redis:8.4.0-alpine
    restart: unless-stopped
  panel:
    image: ghcr.io/pterodactyl/panel:v1.11.11
    restart: unless-stopped
    ports:
      - "802:80" # Web port
      - "4432:443" # This looks like it's for nginx
    # Links these containers together in a docker network.
    links:
      - database
      - cache
    volumes:
      - panel-data:/app/var/
      - panel-logs:/app/storage/logs
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"

volumes:
  wings-data:
    driver_opts:
      type: "nfs"
      o: "addr=nas1.int-net.saphnet.xyz,nolock,soft,rw,nfsvers=4"
      device: ":/mnt/saphnet-nas1a/pterodactyl-data"
  wings-logs:
  database-data:
  panel-data:
  panel-logs:

# This is Wings' Network. We don't need much depth here, all you need to know, is
# that it allows the passthrough of the ports from Wings.
networks:
  ptero0:
    name: ptero0
    driver: bridge
    # ipam:
    #   config:
    #     - subnet: "10.55.231.0/24"
    driver_opts:
      com.docker.network.bridge.name: ptero0